services:
  - type: web
    name: take-profit-portal
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run render:verify
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: take-profit-db
          property: connectionString
      - key: PAYMENT_MODE
        value: sandbox

databases:
  - name: take-profit-db
    plan: starter
    databaseName: take_profit
    user: take_profit
